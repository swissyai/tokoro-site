<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Tokoro is an open-source alpha for local models. Find one that fits, run it, connect your tools, and understand what happens next."
    />
    <meta name="theme-color" content="#030506" />
    <meta property="og:title" content="Tokoro | A place for local models." />
    <meta property="og:description" content="Find one that fits. Run it. Connect your tools. Understand what happens next." />
    <title>Tokoro | A place for local models.</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="world" id="main">
      <canvas class="world-canvas" data-world aria-hidden="true"></canvas>
      <canvas class="text-canvas" data-text-world aria-hidden="true"></canvas>

      <section class="center-stage" aria-labelledby="tokoro-title">
        <div class="identity">
          <div class="signature">
            <div class="threshold-mark" data-threshold aria-hidden="true">
              <span class="threshold-frame threshold-frame-1"></span>
              <span class="threshold-frame threshold-frame-2"></span>
              <span class="threshold-frame threshold-frame-3"></span>
              <span class="threshold-frame threshold-frame-4"></span>
              <span class="threshold-door"></span>
            </div>
            <span class="threshold-bar" aria-hidden="true"></span>
            <h1 id="tokoro-title">TOKORO</h1>
          </div>
          <p class="tagline">A place for local models.</p>
          <p class="japanese-line" lang="ja">デジタルの自由を。</p>
          <p class="release-status">OPEN-SOURCE ALPHA · NO USAGE TELEMETRY</p>
        </div>

        <a
          class="github-link"
          id="github-link"
          href="https://github.com/swissyai/tokoro"
          target="_blank"
          rel="noreferrer"
          aria-label="View Tokoro on GitHub"
        >
          <svg class="github-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              fill-rule="evenodd"
              d="M12 0C5.37 0 0 5.49 0 12.26c0 5.41 3.44 10 8.21 11.62.6.11.82-.27.82-.59 0-.29-.01-1.06-.02-2.08-3.34.74-4.04-1.65-4.04-1.65-.55-1.42-1.34-1.8-1.34-1.8-1.09-.77.08-.75.08-.75 1.21.09 1.84 1.27 1.84 1.27 1.07 1.88 2.81 1.34 3.5 1.03.11-.8.42-1.34.76-1.65-2.67-.31-5.47-1.37-5.47-6.06 0-1.34.46-2.44 1.23-3.3-.12-.31-.54-1.56.12-3.25 0 0 1-.33 3.3 1.26A11.2 11.2 0 0 1 12 6.07c1.02 0 2.04.14 3 .41 2.29-1.59 3.29-1.26 3.29-1.26.66 1.69.25 2.94.12 3.25.77.86 1.23 1.96 1.23 3.3 0 4.71-2.81 5.74-5.48 6.05.43.38.81 1.12.81 2.25 0 1.63-.02 2.93-.02 3.33 0 .32.22.7.83.58A12.25 12.25 0 0 0 24 12.26C24 5.49 18.63 0 12 0Z"
              clip-rule="evenodd"
            />
          </svg>
          <span>GitHub</span>
        </a>
      </section>

      <p class="sr-only">
        Find a local model that fits this machine, run it, connect local tools and agents, and understand its inference state.
      </p>

      <noscript>
        <div class="no-script" aria-label="Tokoro">
          <pre>+---+
|   |
| | |
| | |</pre>
        </div>
      </noscript>
    </main>
  </body>
</html>
